<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3b6f" />
    <title>Nutramigen Quiz</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app">
      <!-- ============ HOME / LANDING ============ -->
      <section id="screen-home" class="screen is-active" aria-labelledby="home-title">
        <header class="home__header">
          <h1 id="home-title" class="home__title"></h1>
          <p class="home__subtitle"></p>
        </header>
        <div class="scene" id="scene">
          <!-- item buttons are rendered by app.js from content.js -->
        </div>
      </section>

      <!-- ============ QUESTION ============ -->
      <section id="screen-question" class="screen" aria-live="polite">
        <div class="progress" role="group" aria-label="Progress">
          <div class="progress__labels">
            <span class="progress__count" id="progress-count">0/5</span>
            <span class="progress__pct" id="progress-pct">0% Complete</span>
          </div>
          <div
            class="progress__track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="progress-track"
          >
            <div class="progress__fill" id="progress-fill"></div>
          </div>
        </div>

        <figure class="question__figure">
          <img id="question-image" class="question__image" alt="" />
        </figure>

        <h2 id="question-text" class="question__text"></h2>

        <!-- 4 answers before answering; 1 (correct) or 2 (incorrect | correct) after -->
        <div id="answers" class="answers"></div>

        <div id="result" class="result" hidden>
          <p id="result-info" class="result__info"></p>
          <button id="back-button" class="back-button" type="button">
            <span class="back-button__arrow" aria-hidden="true">←</span>
            <span id="back-label"></span>
          </button>
        </div>
      </section>

      <!-- ============ END ============ -->
      <section id="screen-end" class="screen" aria-labelledby="end-title">
        <h2 id="end-title" class="end__title"></h2>
        <div class="end__columns">
          <div class="end__col end__col--qr">
            <img id="end-qr" class="end__qr" alt="" />
          </div>
          <div class="end__col end__col--copy">
            <h3 id="end-heading" class="end__heading"></h3>
            <p id="end-body" class="end__body"></p>
          </div>
        </div>
        <button id="restart-button" class="restart-button" type="button"></button>
      </section>
    </main>

    <!-- ============ IDLE POPUP ============ -->
    <div id="idle-modal" class="modal" hidden>
      <div class="modal__dialog" role="alertdialog" aria-modal="true" aria-labelledby="idle-title" aria-describedby="idle-body">
        <h2 id="idle-title" class="modal__title"></h2>
        <p id="idle-body" class="modal__body"></p>
        <p class="modal__countdown">Restarting in <span id="idle-countdown">45</span>s</p>
        <button id="idle-button" class="modal__button" type="button"></button>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>

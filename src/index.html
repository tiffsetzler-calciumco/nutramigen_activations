<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2522" />
    <title>Flip the Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app">
      <!-- ============ 1. ATTRACT: "Tap anywhere to begin" ============ -->
      <section id="screen-attract" class="screen screen--attract is-active" aria-labelledby="attract-title">
        <div class="hero">
          <h1 id="attract-title" class="hero__title"></h1>
          <p id="attract-subtitle" class="hero__subtitle"></p>
        </div>
        <p class="tap-cta">
          <span class="tap-cta__icon" aria-hidden="true">☝</span>
          <span id="attract-cta"></span>
        </p>
      </section>

      <!-- ============ 2. HOME: the mobile ============ -->
      <section id="screen-home" class="screen screen--home" aria-labelledby="home-title">
        <div class="scene" id="scene">
          <div class="hero">
            <h1 id="home-title" class="hero__title hero__title--flip"></h1>
            <p id="home-subtitle" class="hero__subtitle"></p>
          </div>
          <div id="ornaments" class="ornaments"><!-- rendered by app.js --></div>
          <p class="tap-cta">
            <span class="tap-cta__icon" aria-hidden="true">☝</span>
            <span id="home-cta"></span>
          </p>
        </div>
        <footer class="footer"><button class="footer__button js-return" type="button"></button></footer>
      </section>

      <!-- ============ 3. QUESTION ============ -->
      <section id="screen-question" class="screen screen--question">
        <div class="progress" role="group" aria-label="Progress">
          <div class="progress__labels">
            <span id="progress-count">0/5</span>
            <span id="progress-pct">0% Complete</span>
          </div>
          <div id="progress-track" class="progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progress-fill" class="progress__fill"></div>
          </div>
        </div>

        <figure class="question__figure">
          <img id="question-image" class="question__image" alt="" />
        </figure>

        <div class="card" aria-live="polite">
          <h2 id="question-text" class="card__question"></h2>

          <!-- before answering -->
          <div id="ask" class="ask">
            <p id="select-prompt" class="ask__prompt"></p>
            <div id="answers" class="answers"></div>
          </div>

          <!-- after answering -->
          <div id="result" class="result" hidden>
            <div class="result__pair">
              <div>
                <p id="your-label" class="result__label"></p>
                <div id="your-answer" class="pill"></div>
              </div>
              <div>
                <p id="correct-label" class="result__label"></p>
                <div id="correct-answer" class="pill pill--correct"></div>
              </div>
            </div>
            <div id="feedback" class="feedback">
              <p id="feedback-title" class="feedback__title"></p>
              <p id="feedback-info" class="feedback__info"></p>
            </div>
            <button id="next-button" class="next-button" type="button">
              <span id="next-label"></span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
        <footer class="footer"><button class="footer__button js-return" type="button"></button></footer>
      </section>

      <!-- ============ 4. END: score + QR ============ -->
      <section id="screen-end" class="screen screen--end" aria-labelledby="end-title">
        <div class="hero">
          <h1 id="end-title" class="hero__title"></h1>
          <p id="end-score" class="hero__subtitle hero__subtitle--score"></p>
        </div>
        <div class="end-card">
          <img id="end-qr" class="end-card__qr" alt="" />
          <div class="end-card__copy">
            <p id="end-intro" class="end-card__small"></p>
            <h2 id="end-heading" class="end-card__heading"></h2>
            <p id="end-body" class="end-card__small"></p>
            <p id="end-hashtag" class="end-card__small end-card__hashtag"></p>
          </div>
        </div>
        <footer class="footer"><button id="exit-button" class="footer__button footer__button--exit" type="button"></button></footer>
      </section>
    </main>

    <!-- ============ IDLE POPUP ============ -->
    <div id="idle-modal" class="modal" hidden>
      <div class="modal__dialog" role="alertdialog" aria-modal="true" aria-labelledby="idle-question" aria-describedby="idle-heading">
        <button id="idle-close" class="modal__close" type="button" aria-label="Close and keep playing">✕</button>
        <p id="idle-heading" class="modal__heading"></p>
        <p id="idle-body" class="modal__body"></p>
        <h2 id="idle-question" class="modal__question"></h2>
        <button id="idle-button" class="outline-button" type="button"></button>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
